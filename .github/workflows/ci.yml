name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  corpus:
    name: generate + verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate the corpus
        run: python GenerateCorpus.py generate --force

      - name: Verify the corpus
        run: python GenerateCorpus.py verify

      # The determinism guarantee is the corpus's central promise, so it
      # is checked rather than asserted: regenerating from an unchanged
      # tree must reproduce identical hashes.
      - name: Check determinism (regenerate and compare)
        shell: bash
        run: |
          cp UnicodeTestSuite/MasterHashes.sha256 /tmp/first-run.sha256
          cp UnicodeTestSuite/Manifest.csv /tmp/first-run.csv
          python GenerateCorpus.py generate --force
          diff /tmp/first-run.sha256 UnicodeTestSuite/MasterHashes.sha256
          diff /tmp/first-run.csv UnicodeTestSuite/Manifest.csv
          echo "Corpus is byte-identical across runs."

      # Cross-platform determinism: Linux and Windows must agree. This is
      # what a path-separator or newline-translation bug would break.
      - name: Publish master hash
        shell: bash
        run: |
          sha256sum UnicodeTestSuite/MasterHashes.sha256 \
            | cut -d' ' -f1 > master-hash-${{ matrix.os }}.txt
          cat master-hash-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: master-hash-${{ matrix.os }}
          path: master-hash-${{ matrix.os }}.txt

  cross-platform:
    name: cross-platform determinism
    needs: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: master-hash-*
          merge-multiple: true
      - name: Compare hashes across operating systems
        run: |
          echo "Linux:   $(cat master-hash-ubuntu-latest.txt)"
          echo "Windows: $(cat master-hash-windows-latest.txt)"
          if ! diff -q master-hash-ubuntu-latest.txt master-hash-windows-latest.txt; then
            echo "::error::Corpus differs between Linux and Windows."
            exit 1
          fi
          echo "Corpus is byte-identical across operating systems."

  integrity:
    name: verify detects tampering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python GenerateCorpus.py generate --force

      # Each case below was reported as "verified OK" by v2.0. If any of
      # them stops failing, the integrity chain has regressed.
      - name: Tampering with a reference file must fail
        run: |
          echo "TAMPERED" >> UnicodeTestSuite/00_Documentation/Encodings.txt
          if python GenerateCorpus.py verify; then
            echo "::error::verify accepted a modified reference file"; exit 1
          fi
          python GenerateCorpus.py generate --force

      - name: Corrupting the SQLite manifest must fail
        run: |
          printf 'x' >> UnicodeTestSuite/Manifest.sqlite
          if python GenerateCorpus.py verify; then
            echo "::error::verify accepted a corrupted Manifest.sqlite"; exit 1
          fi
          python GenerateCorpus.py generate --force

      - name: An unlisted file must fail
        run: |
          printf 'rogue\n' > UnicodeTestSuite/02_UTF8/10-Latin/ROGUE.txt
          if python GenerateCorpus.py verify; then
            echo "::error::verify accepted a file absent from the manifest"; exit 1
          fi

      - name: sha256sum agrees with the manifest
        run: cd UnicodeTestSuite && rm -f 02_UTF8/10-Latin/ROGUE.txt && sha256sum -c MasterHashes.sha256 --quiet
